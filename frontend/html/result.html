<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/shrink-url.css">
    <link rel="icon" type="image/png" href="../images/ShrinkURL.png">
    <title>shrink-url-result</title>
</head>
<body>

    <header class="header">
        <h1>Shrink URL</h1>
        <p>Fast, simple, and reliable URL shortening.</p>
    </header>
    
    <main>
        <div class="result-container">
            <h2>Shortened URL</h2>
            <p>Your link is ready! Copy it using the button below.</p>
            <input type="text" id="short-url" readonly aria-label="Shortened URL">
            <button type="button" id="copy-button">Copy URL</button>
            <p>Copy the link below and share it with others.</p>
            <p>Long URL: </p>
            <a href="shrink-url.html">
                <button type="button" id="home-button">Shorten Another URL</button>
            </a>
        </div>
    </main>

    <script src="../js/result.js"></script>
    
    <footer>
        <p>&copy; 2026 Shrink URL. All rights reserved.</p>
        <p>Created by <strong>Abi Timalsina</strong></p>
    </footer>

</html>
