<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/result.css">
    <title>shrink-url-result</title>
</head>
<body>
    <header class="header">
        <h1>Shrink URL</h1>
        <p>Fast, simple, and reliable URL shortening.</p>
    </header>
    
    <section id="result">
        <h2>Your shortened URL</h2>
        <p>Your link is ready! Copy it using the button below.</p>
    
        <div class="result-container">
            <input type="text" id="short-url" readonly aria-label="Shortened URL">
            <button type="button" id="copy-button">
                Copy URL
            </button>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2026 Shrink URL. All rights reserved.</p>
        <p>Created by <strong>Abi Timalsina</strong></p>
    </footer>
    
</body>
</html>
